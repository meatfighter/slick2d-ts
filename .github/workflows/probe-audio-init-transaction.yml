name: Probe audio initialization transaction

on:
  push:
    paths:
      - .github/workflows/probe-audio-init-transaction.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run initialization fault probe
        run: |
          cat > /tmp/audio-init-probe.mjs <<'EOF'
          const { AL, SoundStore } = await import(`file://${process.cwd()}/dist/index.js`);

          class FakeGain {
              constructor() {
                  this.gain = { value: 1 };
              }
              connect() {}
          }

          class BrokenAudioContext {
              constructor() {
                  this.state = "running";
                  this.destination = {};
                  this.gainCalls = 0;
              }
              createGain() {
                  this.gainCalls++;
                  if (this.gainCalls === 2) throw new Error("injected second createGain failure");
                  return new FakeGain();
              }
              close() {
                  this.state = "closed";
                  return Promise.resolve();
              }
          }

          Object.defineProperty(globalThis, "AudioContext", { configurable: true, value: BrokenAudioContext, writable: true });
          const store = SoundStore.get();
          try {
              AL.create();
          } catch (error) {
              console.log(`AL.create threw: ${error.message}`);
          }
          console.log(`After failed create: AL.created=${AL.isCreated()}, soundWorks=${store.soundWorks()}, context=${store.context !== null}, soundBus=${store.soundBus !== null}, musicBus=${store.musicBus !== null}, inited=${store.inited}`);

          class WorkingAudioContext {
              constructor() {
                  this.state = "running";
                  this.destination = {};
              }
              createGain() { return new FakeGain(); }
              close() { this.state = "closed"; return Promise.resolve(); }
          }
          Object.defineProperty(globalThis, "AudioContext", { configurable: true, value: WorkingAudioContext, writable: true });
          try {
              AL.create();
              console.log(`After retry: AL.created=${AL.isCreated()}, soundWorks=${store.soundWorks()}, context=${store.context !== null}, soundBus=${store.soundBus !== null}, musicBus=${store.musicBus !== null}, inited=${store.inited}`);
          } catch (error) {
              console.log(`Retry threw: ${error.message}`);
          }

          AL.destroy();
          delete globalThis.AudioContext;
          EOF
          node /tmp/audio-init-probe.mjs
