name: Apply audio lifecycle fixes

on:
    push:
        paths:
            - .github/workflows/apply-audio-lifecycle-fixes.yml

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Apply audio lifecycle fixes
              run: |
                  python3 - <<'PY'
                  from pathlib import Path

                  def replace_once(path: str, old: str, new: str) -> None:
                      file = Path(path)
                      text = file.read_text()
                      count = text.count(old)
                      if count != 1:
                          raise SystemExit(f"Expected one match in {path}, found {count}: {old[:80]!r}")
                      file.write_text(text.replace(old, new))

                  music = "src/slick/Music.ts"

                  replace_once(
                      music,
                      "    private static currentMusic: Music | null = null;\n    private static readonly active = new Set<Music>();",
