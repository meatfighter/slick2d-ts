name: Apply audio lifecycle fixes v2

on:
    push:
        paths:
            - .github/workflows/apply-audio-lifecycle-fixes-v2.yml

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Apply corrected repair script
              run: |
                  python3 - <<'PY'
                  from pathlib import Path

                  workflow = Path(".github/workflows/apply-audio-lifecycle-fixes.yml").read_text()
                  marker = "            - name: Apply audio lifecycle fixes\n              run: |\n"
                  if workflow.count(marker) != 1:
                      raise SystemExit("Could not locate original guarded repair script")
                  script = workflow.split(marker, 1)[1]
                  lines = script.splitlines()
                  script = "\n".join(line[18:] if line.startswith("                  ") else line for line in lines) + "\n"

                  old = '''replace_once(
                      music,
                      "            this.start(this.looped, this.playbackRate, this.volume, this.positionOffset);",
                      "            this.start(this.looped, this.playbackRate, this.volume, this.positionOffset, false);"
                  )
                  '''
                  new = '''replace_once(
                      music,
                      ''' + "'''" + '''    /** Java Slick2D counterpart: Music.resume(). */
                      public resume(): void {
                          if (this.paused) {
                              this.start(this.looped, this.playbackRate, this.volume, this.positionOffset);
                          } else if (this.globallySuspended && SoundStore.get().musicOn()) {
                              this.resumeForMusicOn();
                          }
                      }
                  ''' + "'''" + ''',
                      ''' + "'''" + '''    /** Java Slick2D counterpart: Music.resume(). */
                      public resume(): void {
                          if (this.paused) {
                              this.start(this.looped, this.playbackRate, this.volume, this.positionOffset, false);
                          } else if (this.globallySuspended && SoundStore.get().musicOn()) {
                              this.resumeForMusicOn();
                          }
                      }
                  ''' + "'''" + '''
                  )
                  '''
                  if script.count(old) != 1:
                      raise SystemExit(f"Expected one ambiguous resume replacement block, found {script.count(old)}")
                  Path("/tmp/apply-audio-lifecycle-fixes.sh").write_text(script.replace(old, new))
                  PY
                  bash /tmp/apply-audio-lifecycle-fixes.sh
