name: TypeScript Release Cleanup Helper

on:
  push:
    branches:
      - chatgpt/ts-release-cleanup-20260905
    paths:
      - .github/workflows/ts-release-cleanup-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/ts-release-cleanup-20260905
      - name: Apply behavior-neutral TypeScript cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          graphics = Path('src/slick/Graphics.ts')
          text = graphics.read_text()
          dead = '''    private withRenderTarget<T>(callback: () => T): T {\n        const renderer = this.beginRenderTarget();\n        try {\n            return callback();\n        } finally {\n            this.endRenderTarget(renderer);\n        }\n    }\n\n'''
          if text.count(dead) != 1:
              raise SystemExit(f'expected one dead withRenderTarget helper, found {text.count(dead)}')
          graphics.write_text(text.replace(dead, ''))

          input_path = Path('src/slick/Input.ts')
          text = input_path.read_text()
          old = '''    public constructor(private height: number) {\n        this.additionalControllerAxisBaselines.fill(Number.NaN);\n    }'''
          new = '''    public constructor(height: number) {\n        void height;\n        this.additionalControllerAxisBaselines.fill(Number.NaN);\n    }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Input height parameter property, found {text.count(old)}')
          input_path.write_text(text.replace(old, new))

          config = Path('tsconfig.json')
          text = config.read_text()
          old = '        "noImplicitOverride": true,\n'
          new = '        "noImplicitOverride": true,\n        "noUnusedLocals": true,\n'
          if text.count(old) != 1 or '"noUnusedLocals"' in text:
              raise SystemExit('unexpected tsconfig noUnusedLocals state')
          config.write_text(text.replace(old, new))
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "zeroone"
          git config user.email "54445200+meatfighter@users.noreply.github.com"
          git add src/slick/Graphics.ts src/slick/Input.ts tsconfig.json
          git commit -m "Remove dead Slick TypeScript residue"
          git push origin HEAD:chatgpt/ts-release-cleanup-20260905
