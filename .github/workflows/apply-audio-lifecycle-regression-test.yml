name: Apply audio lifecycle regression test

on:
  push:
    paths:
      - .github/workflows/apply-audio-lifecycle-regression-test.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add browser audio lifecycle regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          verify = Path('test/browser/verify.mjs')
          text = verify.read_text()
          old_import = 'import { AppGameContainer, Color, Display, Image, Input, Renderer, ResourceLoader, XMLPackedSheet } from "../../dist/index.js";'
          new_import = 'import { AppGameContainer, Color, Display, Image, Input, Music, Renderer, ResourceLoader, SoundStore, XMLPackedSheet } from "../../dist/index.js";'
          if text.count(old_import) != 1:
              raise SystemExit('browser verify import anchor changed')
          text = text.replace(old_import, new_import)

          anchor = '''function noopGame(title) {
              return {
                  closeRequested: () => true,
                  getTitle: () => title,
                  init: () => undefined,
                  render: () => undefined,
                  update: () => undefined
              };
          }
          '''
          addition = '''function noopGame(title) {
              return {
                  closeRequested: () => true,
                  getTitle: () => title,
                  init: () => undefined,
                  render: () => undefined,
                  update: () => undefined
              };
          }

          const audioLifecycleRef = "audio/browser-lifecycle.wav";
          let audioLifecycleReady = null;

          function silentWavBytes() {
              const sampleRate = 8000;
              const sampleCount = 80;
              const bytes = new ArrayBuffer(44 + sampleCount * 2);
              const view = new DataView(bytes);
              const writeAscii = (offset, value) => {
                  for (let index = 0; index < value.length; index++) {
                      view.setUint8(offset + index, value.charCodeAt(index));
                  }
              };
              writeAscii(0, "RIFF");
              view.setUint32(4, 36 + sampleCount * 2, true);
              writeAscii(8, "WAVE");
              writeAscii(12, "fmt ");
              view.setUint32(16, 16, true);
              view.setUint16(20, 1, true);
              view.setUint16(22, 1, true);
              view.setUint32(24, sampleRate, true);
              view.setUint32(28, sampleRate * 2, true);
              view.setUint16(32, 2, true);
              view.setUint16(34, 16, true);
              writeAscii(36, "data");
              view.setUint32(40, sampleCount * 2, true);
              return bytes;
          }

          async function prepareAudioLifecycle() {
              if (audioLifecycleReady === null) {
                  ResourceLoader.registerResource(audioLifecycleRef, silentWavBytes());
                  const store = SoundStore.get();
                  store.init();
                  audioLifecycleReady = store.preloadAudioBuffer(audioLifecycleRef);
              }
              await audioLifecycleReady;
          }

          async function runMusicLifecycleCycle() {
              await prepareAudioLifecycle();
              const music = new Music(audioLifecycleRef);
              await music.ready();
              music.loop();
              await new Promise((resolve) => setTimeout(resolve, 0));
              music.stop();
              await new Promise((resolve) => setTimeout(resolve, 10));
          }

          async function runSoundLifecycleCycle() {
              await prepareAudioLifecycle();
              const handle = SoundStore.get().playSound(audioLifecycleRef, 1, 1, true);
              assert(handle !== null, "SoundStore did not create an audio lifecycle test handle");
              await new Promise((resolve) => setTimeout(resolve, 0));
              handle.stop();
              await new Promise((resolve) => setTimeout(resolve, 10));
          }

          function cleanupAudioLifecycle() {
              SoundStore.get().destroy();
              ResourceLoader.clearCache();
              audioLifecycleReady = null;
          }

          globalThis.__slickAudioLifecycle = {
              runMusicCycle: runMusicLifecycleCycle,
              runSoundCycle: runSoundLifecycleCycle,
              cleanup: cleanupAudioLifecycle
          };
          '''
          if text.count(anchor) != 1:
              raise SystemExit('noopGame anchor changed')
          text = text.replace(anchor, addition)

          anchor2 = '    await verifyContainerRestartPathTexture();\n    passed.push("container restart texture cache boundary");\n'
          addition2 = '    await verifyContainerRestartPathTexture();\n    passed.push("container restart texture cache boundary");\n\n    await prepareAudioLifecycle();\n    passed.push("audio lifecycle fixture");\n'
          if text.count(anchor2) != 1:
              raise SystemExit('browser run anchor changed')
          text = text.replace(anchor2, addition2)
          verify.write_text(text)

          runner = Path('scripts/run-browser-tests.mjs')
          text = runner.read_text()
          marker = 'async function pathExists(path) {'
          helpers = '''async function collectBrowserListenerCount(page) {
              await page.call("HeapProfiler.collectGarbage");
              await new Promise((resolveDelay) => setTimeout(resolveDelay, 75));
              await page.call("HeapProfiler.collectGarbage");
              const counters = await page.call("Memory.getDOMCounters");
              return counters.jsEventListeners;
          }

          async function runAudioLifecycleCycles(page, method, cycles) {
              const evaluation = await page.call("Runtime.evaluate", {
                  expression: `(async () => {
                      const api = globalThis.__slickAudioLifecycle;
                      if (!api) throw new Error("Audio lifecycle browser fixture is unavailable");
                      for (let index = 0; index < ${cycles}; index++) {
                          await api[${JSON.stringify(method)}]();
                      }
                      return true;
                  })()`,
                  awaitPromise: true,
                  returnByValue: true
              });
              if (evaluation.exceptionDetails) {
                  throw new Error(`Audio lifecycle evaluation failed: ${JSON.stringify(evaluation.exceptionDetails)}`);
              }
          }

          async function verifyAudioLifecycleListenerCleanup(page) {
              for (const [label, method] of [
                  ["Music", "runMusicCycle"],
                  ["SoundStore", "runSoundCycle"]
              ]) {
                  await runAudioLifecycleCycles(page, method, 1);
                  const baseline = await collectBrowserListenerCount(page);
                  await runAudioLifecycleCycles(page, method, 8);
                  const after = await collectBrowserListenerCount(page);
                  const growth = after - baseline;
                  console.log(`${label} listener lifecycle: ${baseline} -> ${after} (${growth >= 0 ? "+" : ""}${growth})`);
                  if (growth > 0) {
                      throw new Error(`${label} leaked ${growth} browser event listener(s) across eight explicit stop cycles.`);
                  }
              }
              await page.call("Runtime.evaluate", {
                  expression: "globalThis.__slickAudioLifecycle?.cleanup(); true;",
                  returnByValue: true
              });
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit('pathExists anchor changed')
          text = text.replace(marker, helpers + marker)

          anchor3 = '    const output = await waitForBrowserResult(page, browserDocument);\n    console.log(output);\n'
          addition3 = '    const output = await waitForBrowserResult(page, browserDocument);\n    console.log(output);\n    await verifyAudioLifecycleListenerCleanup(page);\n'
          if text.count(anchor3) != 1:
              raise SystemExit('browser output anchor changed')
          text = text.replace(anchor3, addition3)
          runner.write_text(text)
          PY

          npx prettier test/browser/verify.mjs scripts/run-browser-tests.mjs --write

      - name: Commit regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/browser/verify.mjs scripts/run-browser-tests.mjs
          git commit -m "Add Web Audio lifecycle regression test"
          git push
