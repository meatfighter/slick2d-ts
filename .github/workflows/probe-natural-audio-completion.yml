name: Probe natural audio completion

on:
  push:
    paths:
      - .github/workflows/probe-natural-audio-completion.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add temporary natural-completion checks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          verify = Path('test/browser/verify.mjs')
          text = verify.read_text()
          anchor = '''async function runSoundLifecycleCycle() {
              await prepareAudioLifecycle();
              const handle = SoundStore.get().playSound(audioLifecycleRef, 1, 1, true);
              assert(handle !== null, "SoundStore did not create an audio lifecycle test handle");
              await new Promise((resolve) => setTimeout(resolve, 0));
              handle.stop();
              await new Promise((resolve) => setTimeout(resolve, 10));
          }
          '''
          addition = anchor + '''
          async function runNaturalMusicLifecycleCycle() {
              await prepareAudioLifecycle();
              const music = new Music(audioLifecycleRef);
              await music.ready();
              music.play();
              await new Promise((resolve) => setTimeout(resolve, 40));
          }

          async function runNaturalSoundLifecycleCycle() {
              await prepareAudioLifecycle();
              const handle = SoundStore.get().playSound(audioLifecycleRef, 1, 1, false);
              assert(handle !== null, "SoundStore did not create a natural-completion test handle");
              await new Promise((resolve) => setTimeout(resolve, 40));
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit('sound lifecycle anchor changed')
          text = text.replace(anchor, addition)
          old = '''globalThis.__slickAudioLifecycle = {
              runMusicCycle: runMusicLifecycleCycle,
              runSoundCycle: runSoundLifecycleCycle,
              cleanup: cleanupAudioLifecycle
          };
          '''
          new = '''globalThis.__slickAudioLifecycle = {
              runMusicCycle: runMusicLifecycleCycle,
              runSoundCycle: runSoundLifecycleCycle,
              runNaturalMusicCycle: runNaturalMusicLifecycleCycle,
              runNaturalSoundCycle: runNaturalSoundLifecycleCycle,
              cleanup: cleanupAudioLifecycle
          };
          '''
          if text.count(old) != 1:
              raise SystemExit('audio lifecycle export anchor changed')
          verify.write_text(text.replace(old, new))

          runner = Path('scripts/run-browser-tests.mjs')
          text = runner.read_text()
          old = '''    for (const [label, method] of [
                  ["Music", "runMusicCycle"],
                  ["SoundStore", "runSoundCycle"]
              ]) {
          '''
          new = '''    for (const [label, method] of [
                  ["Music explicit stop", "runMusicCycle"],
                  ["SoundStore explicit stop", "runSoundCycle"],
                  ["Music natural completion", "runNaturalMusicCycle"],
                  ["SoundStore natural completion", "runNaturalSoundCycle"]
              ]) {
          '''
          if text.count(old) != 1:
              raise SystemExit('audio lifecycle loop anchor changed')
          runner.write_text(text.replace(old, new))
          PY
          npx prettier test/browser/verify.mjs scripts/run-browser-tests.mjs --write

      - name: Run real Chromium probe
        run: npm run verify:browser
