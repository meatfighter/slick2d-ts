name: Apply v1.5.3 maintenance

on:
    push:
        paths:
            - ".github/workflows/apply-v1-5-3-maintenance.yml"

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Apply maintenance
              run: python .github/scripts/apply-v1-5-3.py

            - name: Prepare candidate tree
              shell: bash
              run: |
                  npm install --package-lock-only --ignore-scripts
                  npm run format
                  npm run build
                  git add -A
                  git diff --cached --check
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Release v1.5.3 resource preload controls"

            - name: Verify source and Node tests
              run: npm run verify

            - name: Verify browser behavior
              run: npm run verify:browser

            - name: Publish release
              shell: bash
              run: |
                  git rm .github/workflows/apply-v1-5-3-maintenance.yml .github/scripts/apply-v1-5-3.py
                  git commit --amend --no-edit
                  git push
                  git tag v1.5.3
                  git push origin v1.5.3
