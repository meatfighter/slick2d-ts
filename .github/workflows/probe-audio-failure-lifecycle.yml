name: Probe audio failure lifecycle

on:
  push:
    paths:
      - .github/workflows/probe-audio-failure-lifecycle.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run failure lifecycle probe
        run: |
          cat > /tmp/audio-failure-probe.mjs <<'EOF'
          const { AL, Music, ResourceLoader, Sound, SoundStore } = await import(`file://${process.cwd()}/dist/index.js`);

          class FakeAudioBuffer {
              constructor() {
                  this.duration = 10;
              }
          }

          class FakeGain {
              static created = [];
              constructor() {
                  this.gain = { value: 1 };
                  this.disconnectCalls = 0;
                  FakeGain.created.push(this);
              }
              connect() {}
              disconnect() {
                  this.disconnectCalls++;
              }
          }

          class FakeSource {
              static created = [];
              static throwOnStart = false;
              constructor() {
                  this.buffer = null;
                  this.loop = false;
                  this.onended = null;
                  this.playbackRate = { value: 1 };
                  this.disconnectCalls = 0;
                  this.stopCalls = 0;
                  FakeSource.created.push(this);
              }
              connect() {}
              disconnect() {
                  this.disconnectCalls++;
              }
              start() {
                  if (FakeSource.throwOnStart) {
                      throw new Error("injected source.start failure");
                  }
              }
              stop() {
                  this.stopCalls++;
              }
          }

          class FakeAudioContext {
              constructor() {
                  this.currentTime = 0;
                  this.destination = {};
                  this.state = "running";
              }
              createBufferSource() {
                  return new FakeSource();
              }
              createGain() {
                  return new FakeGain();
              }
              decodeAudioData() {
                  return Promise.resolve(new FakeAudioBuffer());
              }
              resume() {
                  this.state = "running";
                  return Promise.resolve();
              }
              close() {
                  this.state = "closed";
                  return Promise.resolve();
              }
          }

          Object.defineProperty(globalThis, "AudioContext", {
              configurable: true,
              value: FakeAudioContext,
              writable: true
          });
          ResourceLoader.registerResource("probe.wav", new Uint8Array([1, 2, 3, 4]));
          AL.create();

          async function settle() {
              for (let i = 0; i < 12; i++) await Promise.resolve();
              await new Promise((resolve) => setTimeout(resolve, 0));
          }

          const idle = new Music("probe.wav");
          await idle.ready();
          idle.fade(100, 0, false);
          const idleActiveBefore = Music.active.has(idle);
          Music.poll(100);
          console.log(`Idle fade after poll: volume=${idle.getVolume()}, active-before=${idleActiveBefore}, active-after=${Music.active.has(idle)}`);
          idle.stop();

          FakeSource.throwOnStart = true;
          const music = new Music("probe.wav");
          await music.ready();
          music.loop();
          await settle();
          const musicSource = FakeSource.created.at(-1);
          const musicGain = FakeGain.created.at(-1);
          console.log(
              `Music start failure: source-field=${music.source !== null}, gain-field=${music.gain !== null}, onended=${musicSource?.onended !== null}, source-disconnects=${musicSource?.disconnectCalls}, gain-disconnects=${musicGain?.disconnectCalls}, tracked-handle=${music.handle !== null}`
          );

          FakeSource.created = [];
          FakeGain.created = [];
          const sound = new Sound("probe.wav");
          await sound.ready();
          sound.play();
          const failedHandle = sound.active;
          await settle();
          const soundSource = FakeSource.created.at(-1);
          const soundGain = FakeGain.created.at(-1);
          console.log(
              `Sound start failure: active-handle=${sound.active !== null}, handle-playing=${failedHandle?.playing()}, onended=${soundSource?.onended !== null}, source-disconnects=${soundSource?.disconnectCalls}, gain-disconnects=${soundGain?.disconnectCalls}`
          );

          AL.destroy();
          ResourceLoader.clearCache();
          delete globalThis.AudioContext;
          EOF
          node /tmp/audio-failure-probe.mjs
