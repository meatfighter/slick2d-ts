name: Apply Web Audio lifecycle fix

on:
  push:
    paths:
      - .github/workflows/apply-web-audio-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fix explicit Web Audio source teardown
        run: |
          python3 - <<'PY'
          from pathlib import Path

          music = Path('src/slick/Music.ts')
          text = music.read_text()
          old = '''        this.stopRequested = requested;
                  const source = this.source;
                  this.source = null;
                  this.gain = null;
                  if (!keepHandle) {
                      this.clearHandle();
                  }
                  try {
                      source.stop();
                  } catch {
                      // Ignore duplicate stop calls; Web Audio throws when a source is already stopped.
                  }
          '''
          new = '''        this.stopRequested = requested;
                  const source = this.source;
                  const gain = this.gain;
                  this.source = null;
                  this.gain = null;
                  if (!keepHandle) {
                      this.clearHandle();
                  }
                  source.onended = null;
                  try {
                      source.stop();
                  } catch {
                      // Ignore duplicate stop calls; Web Audio throws when a source is already stopped.
                  }
                  try {
                      source.disconnect();
                  } catch {
                      // A source can already be disconnected during repeated teardown.
                  }
                  try {
                      gain?.disconnect();
                  } catch {
                      // A gain node can already be disconnected during repeated teardown.
                  }
          '''
          if text.count(old) != 1:
              raise SystemExit('Music.stopSource anchor changed')
          text = text.replace(old, new)

          old2 = '''        this.source = source;
                  this.gain = context.createGain();
                  source.buffer = buffer;
                  source.loop = loop;
                  source.playbackRate.value = this.playbackRate;
                  this.gain.gain.value = this.volume;
                  source.connect(this.gain);
                  this.gain.connect(bus);
          '''
          new2 = '''        this.source = source;
                  const gain = context.createGain();
                  this.gain = gain;
                  source.buffer = buffer;
                  source.loop = loop;
                  source.playbackRate.value = this.playbackRate;
                  gain.gain.value = this.volume;
                  source.connect(gain);
                  gain.connect(bus);
          '''
          if text.count(old2) != 1:
              raise SystemExit('Music.startSource gain anchor changed')
          text = text.replace(old2, new2)

          old3 = '''        source.onended = () => {
                      if (this.source !== source) {
                          return;
                      }
                      const requested = this.stopRequested;
                      this.source = null;
                      this.gain = null;
          '''
          new3 = '''        source.onended = () => {
                      source.onended = null;
                      try {
                          source.disconnect();
                      } catch {
                          // The source may already have been disconnected by explicit teardown.
                      }
                      try {
                          gain.disconnect();
                      } catch {
                          // The gain may already have been disconnected by explicit teardown.
                      }
                      if (this.source !== source) {
                          return;
                      }
                      const requested = this.stopRequested;
                      this.source = null;
                      this.gain = null;
          '''
          if text.count(old3) != 1:
              raise SystemExit('Music.onended anchor changed')
          music.write_text(text.replace(old3, new3))

          store = Path('src/slick/openal/SoundStore.ts')
          text = store.read_text()
          old = '''        let source: AudioBufferSourceNode | null = null;
                  let sourceGain = 0;
                  let playing = true;
          '''
          new = '''        let source: AudioBufferSourceNode | null = null;
                  let gain: GainNode | null = null;
                  let sourceGain = 0;
                  let playing = true;
          '''
          if text.count(old) != 1:
              raise SystemExit('SoundStore source anchor changed')
          text = text.replace(old, new)

          old2 = '''                if (source) {
                              const stoppedSource = source;
                              source = null;
                              try {
                                  stoppedSource.stop();
                              } catch {
                                  // Ignore duplicate stop calls; Web Audio throws when a source is already stopped.
                              }
                          }
                          playing = false;
          '''
          new2 = '''                if (source) {
                              const stoppedSource = source;
                              source = null;
                              stoppedSource.onended = null;
                              try {
                                  stoppedSource.stop();
                              } catch {
                                  // Ignore duplicate stop calls; Web Audio throws when a source is already stopped.
                              }
                              try {
                                  stoppedSource.disconnect();
                              } catch {
                                  // A source can already be disconnected during repeated teardown.
                              }
                          }
                          try {
                              gain?.disconnect();
                          } catch {
                              // A gain node can already be disconnected during repeated teardown.
                          }
                          gain = null;
                          playing = false;
          '''
          if text.count(old2) != 1:
              raise SystemExit('SoundStore stop anchor changed')
          text = text.replace(old2, new2)

          old3 = '''                const gain = context.createGain();
                          source = context.createBufferSource();
                          source.buffer = buffer;
                          source.loop = loop;
                          source.playbackRate.value = Math.max(0.25, Math.min(4, pitch));
                          sourceGain = Math.max(0, volume * this.soundVolume);
                          gain.gain.value = sourceGain;
                          source.connect(gain);
                          this.connectPositionedSource(context, gain, bus, position);
                          source.onended = () => {
                              if (requestedStop || source?.loop) {
                                  return;
                              }
                              source = null;
                              playing = false;
          '''
          new3 = '''                gain = context.createGain();
                          source = context.createBufferSource();
                          source.buffer = buffer;
                          source.loop = loop;
                          source.playbackRate.value = Math.max(0.25, Math.min(4, pitch));
                          sourceGain = Math.max(0, volume * this.soundVolume);
                          gain.gain.value = sourceGain;
                          source.connect(gain);
                          this.connectPositionedSource(context, gain, bus, position);
                          const startedSource = source;
                          const startedGain = gain;
                          source.onended = () => {
                              startedSource.onended = null;
                              try {
                                  startedSource.disconnect();
                              } catch {
                                  // The source may already have been disconnected by explicit teardown.
                              }
                              try {
                                  startedGain.disconnect();
                              } catch {
                                  // The gain may already have been disconnected by explicit teardown.
                              }
                              if (source !== startedSource) {
                                  return;
                              }
                              const wasLooping = startedSource.loop;
                              source = null;
                              gain = null;
                              if (requestedStop || wasLooping) {
                                  return;
                              }
                              playing = false;
          '''
          if text.count(old3) != 1:
              raise SystemExit('SoundStore onended anchor changed')
          store.write_text(text.replace(old3, new3))
          PY

          npx prettier src/slick/Music.ts src/slick/openal/SoundStore.ts --write

      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/slick/Music.ts src/slick/openal/SoundStore.ts
          git commit -m "Release stopped Web Audio source handlers"
          git push
