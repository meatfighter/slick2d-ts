name: Verify

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify source, generated output, and tests
              run: npm run verify

    browser:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify real Chromium behavior
              run: npm run verify:browser

            - name: Archive qualified build
              run: node scripts/archive-release.mjs dist "$RUNNER_TEMP/qualified-artifacts"

            - name: Retain build and checksums
              uses: actions/upload-artifact@v4
              with:
                  name: qualified-${{ github.sha }}
                  path: ${{ runner.temp }}/qualified-artifacts
                  retention-days: 90
                  if-no-files-found: error
